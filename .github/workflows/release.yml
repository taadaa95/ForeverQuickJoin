name: Publish WoW Forever Release

# Version bumps to main, matching tags, and manual dispatch all publish if missing.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      retry_curseforge:
        description: "Retry CurseForge upload for current version (use ONLY if that version is absent on CurseForge)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: foreverquickjoin-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out addon source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate WoW Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          luac5.1 -p ForeverQuickJoin.lua ForeverQuickJoin_Host.lua ForeverQuickJoin_Party.lua ForeverQuickJoin_Applications.lua ForeverQuickJoin_Theme.lua tests/applications_smoke.lua tests/composition_smoke.lua tests/sent_lifecycle_smoke.lua tests/theme_smoke.lua tests/multi_activity_smoke.lua tests/ui_features_smoke.lua tests/description_smoke.lua tests/tab_isolation_smoke.lua tests/dungeon_keybind_smoke.lua
          lua5.1 tests/applications_smoke.lua
          lua5.1 tests/composition_smoke.lua
          lua5.1 tests/sent_lifecycle_smoke.lua
          lua5.1 tests/theme_smoke.lua
          lua5.1 tests/multi_activity_smoke.lua
          lua5.1 tests/ui_features_smoke.lua
          lua5.1 tests/description_smoke.lua
          lua5.1 tests/tab_isolation_smoke.lua
          lua5.1 tests/dungeon_keybind_smoke.lua

      - name: Package for WoW Forever and WowUp
        id: package
        run: python3 scripts/package_release.py

      - name: Validate CurseForge upload archive and metadata (offline)
        env:
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ZIP: ${{ steps.package.outputs.zip }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes }}
        run: |
          python3 scripts/upload_curseforge.py \
            --file "$RELEASE_ZIP" \
            --notes "$RELEASE_NOTES" \
            --tag "$RELEASE_TAG" \
            --dry-run

      - name: Publish version if not already released
        id: github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ZIP: ${{ steps.package.outputs.zip }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Forever QuickJoin $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES" \
            --latest
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Do not re-upload existing versions on unrelated source/doc changes.
      # This step activates only after CURSEFORGE_API_TOKEN is added to the
      # repository's Actions secrets. Tokens are never stored in the source.
      - name: Submit newly published release to CurseForge
        if: steps.github_release.outputs.created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_curseforge == true)
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_GAME_VERSION_ID: ${{ vars.CURSEFORGE_GAME_VERSION_ID }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ZIP: ${{ steps.package.outputs.zip }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CURSEFORGE_API_TOKEN:-}" ]; then
            echo "::notice::CurseForge upload not configured: add CURSEFORGE_API_TOKEN in repository Actions secrets."
            exit 0
          fi
          python3 scripts/upload_curseforge.py \
            --file "$RELEASE_ZIP" \
            --notes "$RELEASE_NOTES" \
            --tag "$RELEASE_TAG"
